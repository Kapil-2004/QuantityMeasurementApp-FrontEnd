<!DOCTYPE html>
<html lang="en">
<head>
  <!-- 
    The meta tags and links below are essential for:
    1. Responsive design (viewport)
    2. SEO (description)
    3. Styling (main.css)
    4. External integrations (Google SDK for OAuth and Axios for API calls)
  -->
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — QuantiMeasure</title>
  <meta name="description" content="Sign in to QuantiMeasure — the smart quantity measurement and conversion platform."/>
  <link rel="stylesheet" href="css/main.css"/>
  <!-- Google SDK: Required for "Continue with Google" functionality -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Axios: Used for all promise-based HTTP requests to our .NET Backend -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="auth-page">

  <!-- Animated background orbs -->
  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>
  <div class="orb orb-3" aria-hidden="true"></div>

  <!-- Toast container -->
  <div id="toast-container" role="status" aria-live="polite"></div>

  <!-- Login Card -->
  <main class="auth-card" id="login-card">
    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo-icon" aria-hidden="true">📐</div>
      <span class="auth-logo-text">QuantiMeasure</span>
    </div>

    <h1 class="auth-title">Welcome back!</h1>
    <p class="auth-subtitle">Sign in to your account to continue measuring.</p>

    <!-- Alert -->
    <div class="alert alert-error" id="login-alert" role="alert">
      <span class="alert-icon">⚠️</span>
      <span id="login-alert-msg">Something went wrong.</span>
    </div>

    <!-- Google Login -->
    <div id="btn-google-login" style="margin-bottom: 1.5rem; min-height: 44px; display: flex; justify-content: center;">
      <!-- Google's official button will be rendered here by auth.js -->
    </div>

    <div class="divider">or sign in with email</div>

    <!-- Login Form -->
    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="login-username">Username</label>
        <div class="input-wrap">
          <input
            class="form-input"
            type="text"
            id="login-username"
            name="username"
            placeholder="your_username"
            autocomplete="username"
            required
            minlength="3"
          />
          <span class="input-icon" aria-hidden="true">👤</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <div class="input-wrap">
          <input
            class="form-input"
            type="password"
            id="login-password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
            minlength="6"
          />
          <span class="input-icon" aria-hidden="true">🔒</span>
          <button class="input-toggle" type="button" id="toggle-login-pw" aria-label="Toggle password visibility">👁️</button>
        </div>
      </div>

      <label class="checkbox-wrap" for="remember-me">
        <input type="checkbox" id="remember-me" name="remember"/>
        <span class="checkbox-custom"></span>
        Remember me
      </label>

      <button class="btn btn-primary" type="submit" id="btn-login">
        <span class="btn-text">Sign In</span>
        <span class="spinner hidden" id="login-spinner" aria-label="Loading"></span>
      </button>
    </form>

    <p class="auth-footer">
      New here? <a href="signup.html" class="link-prominent" id="link-signup">Create a new account →</a>
    </p>
  </main>

  <!-- 
    Script Loading Order:
    1. api.js must load first as it contains the AuthService and QuantityService classes used by others.
    2. auth.js contains the page-specific logic for handling form submissions and Google OAuth callbacks.
  -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
